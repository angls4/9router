<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>9Router Rust</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#191f29;--muted:#98a2b3;--line:#2b3442;--accent:#71d6ae;--danger:#ff7b72}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#203437 0,transparent 40%),var(--bg);color:#eef2f7;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1050px;margin:0 auto;padding:38px 22px 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:22px;font-weight:750;letter-spacing:-.04em}.brand b{color:var(--accent)}.tag{color:var(--muted);font-size:13px}textarea{width:100%;min-height:74px;background:#10151c;border:1px solid var(--line);border-radius:8px;padding:10px;color:#f4f6fa;font:inherit;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#191f29eb;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 16px 50px #0002}.wide{grid-column:1/-1}h1{font-size:28px;letter-spacing:-.04em;margin:0 0 8px}h2{font-size:17px;margin:0 0 14px}.muted{color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,select{width:100%;background:#10151c;border:1px solid var(--line);border-radius:8px;padding:10px;color:#f4f6fa;font:inherit}button{border:0;border-radius:8px;background:var(--accent);color:#092019;font-weight:700;padding:10px 14px;cursor:pointer;margin-top:12px}button.secondary{background:#293443;color:#e5ebf3}button.delete{background:#482b30;color:#ffaaa4;margin:0}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.item strong{display:block}.item small{color:var(--muted);word-break:break-word}.status{margin:12px 0;color:var(--accent);min-height:22px}.status.error{color:var(--danger)}.empty{color:var(--muted);padding:8px 0}.logs{font:12px ui-monospace,monospace;overflow:auto}.badge{font-size:11px;color:var(--accent);border:1px solid #315b4b;border-radius:20px;padding:2px 7px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}header{align-items:flex-start;gap:12px;flex-direction:column}}
</style>
</head>
<body><main>
<header><div class="brand"><b>9</b>Router <span class="muted">Rust</span></div><div class="row" style="flex:0 1 430px"><input id="access-key" type="password" placeholder="Gateway API key (optional)"><button class="secondary" style="flex:0 0 auto;margin:0" onclick="saveAccessKey()">Set key</button></div></header>
<section class="card" style="margin-bottom:18px"><h1>Route models your way.</h1><div class="muted">Add an OpenAI compatible or Anthropic provider, then connect your client to <code>/v1</code>.</div><div id="status" class="status"></div></section>
<div class="grid">
<section class="card"><h2>Provider</h2><label>Provider ID</label><input id="provider-id" placeholder="auto from name"><label>Name</label><input id="name" placeholder="My provider"><label>Base URL</label><input id="base-url" placeholder="https://api.openai.com/v1"><label>Upstream API key</label><input id="api-key" type="password" placeholder="sk-…"><div class="row"><div><label>Protocol</label><select id="api-format"><option value="openai">OpenAI compatible</option><option value="anthropic">Anthropic native</option></select></div><div><label>Models (comma separated)</label><input id="models" placeholder="gpt-4.1-mini, gpt-4.1"></div></div><button onclick="saveProvider()">Save provider</button><button class="secondary" onclick="resetProvider()">Clear</button></section>
<section class="card"><h2>Fallback combo</h2><label>Combo name</label><input id="combo-name" placeholder="fast-and-safe"><label>Ordered targets (one provider/model per line)</label><textarea id="combo-models" placeholder="provider-id/model-name, one per line"></textarea><button onclick="saveCombo()">Save combo</button><div class="muted" style="margin-top:10px;font-size:12px">Retries the next target on network errors, 408, 409, 429, or 5xx.</div></section>
<section class="card"><h2>Providers</h2><div id="providers" class="empty">Loading…</div></section>
<section class="card"><h2>Combos</h2><div id="combos" class="empty">Loading…</div></section>
<section class="card wide"><h2>Recent requests</h2><div id="requests" class="logs empty">No requests yet.</div></section>
</div></main>
<script>
async function api(path,options={}){const key=localStorage.getItem('9router-key')||'';const headers={'Content-Type':'application/json',...(key?{'Authorization':'Bearer '+key}:{}),...(options.headers||{})};const res=await fetch(path,{...options,headers});if(!res.ok){let msg=res.statusText;try{msg=(await res.json()).error?.message||msg}catch{}throw Error(msg)}return res.status===204?null:res.json()}
function saveAccessKey(){localStorage.setItem('9router-key',v('access-key'));set('access-key','');say('Access key saved in this browser.');load()}
function say(text,error=false){const el=document.getElementById('status');el.textContent=text;el.className='status'+(error?' error':'')}
async function load(){try{const [p,c,r]=await Promise.all([api('/admin/providers'),api('/admin/combos'),api('/admin/requests')]);drawProviders(p.providers);drawCombos(c.combos);drawRequests(r.requests);say('Gateway is ready. Configure a provider to get started.')}catch(e){say(e.message+' If API auth is enabled, set the gateway key in browser local storage as 9router-key.',true)}}
function drawProviders(items){const root=document.getElementById('providers');if(!items.length){root.innerHTML='<div class="empty">No providers configured.</div>';return}root.innerHTML=items.map(p=>`<div class="item"><div><strong>${esc(p.name)} ${p.enabled?'<span class="badge">enabled</span>':''}</strong><small>${esc(p.id)} · ${esc(p.baseUrl)}<br>${p.models.map(esc).join(', ')||'Any model'}</small></div><div class="row" style="flex:0 0 auto"><button class="secondary" onclick="editProvider('${esc(p.id)}')">Edit</button><button class="delete" onclick="removeProvider('${esc(p.id)}')">×</button></div></div>`).join('')}
function drawCombos(items){const root=document.getElementById('combos');if(!items.length){root.innerHTML='<div class="empty">No fallback combos configured.</div>';return}root.innerHTML=items.map(c=>`<div class="item"><div><strong>${esc(c.name)}</strong><small>${c.models.map(esc).join(' → ')}</small></div><button class="delete" onclick="removeCombo('${esc(c.id)}')">×</button></div>`).join('')}
function drawRequests(items){const root=document.getElementById('requests');if(!items.length){root.textContent='No requests yet.';return}root.innerHTML=items.map(r=>`${esc(r.createdAt)} · ${r.status} · ${esc(r.requestedModel)} → ${esc(r.routedModel)} · ${r.elapsedMs} ms`).join('<br>')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function saveProvider(){try{const id=document.getElementById('provider-id').value;const data={id:id||undefined,name:v('name'),baseUrl:v('base-url'),apiKey:v('api-key'),apiFormat:v('api-format'),models:v('models').split(',').map(x=>x.trim()).filter(Boolean)};const out=await api('/admin/providers',{method:'PUT',body:JSON.stringify(data)});say('Saved '+out.provider.name);resetProvider();await load()}catch(e){say(e.message,true)}}
async function editProvider(id){try{const {providers}=await api('/admin/providers');const p=providers.find(x=>x.id===id);if(!p)return;document.getElementById('provider-id').value=p.id;set('name',p.name);set('base-url',p.baseUrl);set('api-format',p.apiFormat);set('models',p.models.join(', '));set('api-key','');say('Leave the upstream key blank to keep the saved key.')}catch(e){say(e.message,true)}}
function resetProvider(){['provider-id','name','base-url','api-key','models'].forEach(id=>set(id,''));set('api-format','openai')}
async function removeProvider(id){if(!confirm('Delete this provider?'))return;try{await api('/admin/providers/'+encodeURIComponent(id),{method:'DELETE'});say('Provider deleted');await load()}catch(e){say(e.message,true)}}
async function saveCombo(){try{const name=v('combo-name');const models=v('combo-models').split(/[\n,]/).map(x=>x.trim()).filter(Boolean);const out=await api('/admin/combos',{method:'PUT',body:JSON.stringify({name,models})});say('Saved combo '+out.combo.name);set('combo-name','');set('combo-models','');await load()}catch(e){say(e.message,true)}}
async function removeCombo(id){if(!confirm('Delete this combo?'))return;try{await api('/admin/combos/'+encodeURIComponent(id),{method:'DELETE'});say('Combo deleted');await load()}catch(e){say(e.message,true)}}
function v(id){return document.getElementById(id).value.trim()}function set(id,value){document.getElementById(id).value=value}load();setInterval(load,15000);
</script></body></html>
